<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reorder film</title>
<style>
  :root { --bg:#f4f3f0; --fg:#1a1a1a; --mute:#8a8a86; --line:#dcdad5; --accent:#4b4fd8; --card:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141414; --fg:#ececea; --mute:#7c7c78; --line:#2a2a2a; --accent:#8a8dff; --card:#1d1d1d; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 -apple-system, "Helvetica Neue", sans-serif; }
  header { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:16px; padding:12px 20px; background:var(--bg); border-bottom:1px solid var(--line); }
  header h1 { font-size:15px; font-weight:500; margin:0; }
  header .meta { color:var(--mute); }
  header .spacer { flex:1; }
  button { font:inherit; padding:7px 14px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--fg); cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:disabled { opacity:.45; cursor:default; }
  a.link { color:var(--mute); text-decoration:none; }
  a.link:hover { color:var(--fg); }
  #status { color:var(--mute); min-width:80px; text-align:right; }
  #status.dirty { color:var(--accent); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:14px; padding:20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px; cursor:grab; user-select:none; position:relative; transition:transform .12s, opacity .12s; }
  .card:active { cursor:grabbing; }
  .card.dragging { opacity:.35; }
  .card.over-before { box-shadow:-3px 0 0 var(--accent); }
  .card.over-after { box-shadow:3px 0 0 var(--accent); }
  .card .thumb { width:100%; aspect-ratio:3/2; object-fit:contain; background:#000; border-radius:4px; display:block; pointer-events:none; }
  .card .row { display:flex; align-items:center; gap:6px; margin-top:8px; }
  .card .n { font-variant-numeric:tabular-nums; color:var(--mute); width:24px; font-size:12px; }
  .card input { flex:1; min-width:0; font:inherit; padding:4px 6px; border:1px solid transparent; border-radius:4px; background:transparent; color:var(--fg); }
  .card input:hover { border-color:var(--line); }
  .card input:focus { outline:none; border-color:var(--accent); background:var(--bg); }
  .card .rm { border:none; background:none; color:var(--mute); padding:2px 6px; font-size:16px; line-height:1; }
  .card .rm:hover { color:#d33; }
  .card .new { position:absolute; top:14px; left:14px; background:var(--accent); color:#fff; font-size:10px; letter-spacing:.06em; text-transform:uppercase; padding:3px 7px; border-radius:4px; }
  .card .file { font-size:11px; color:var(--mute); margin:4px 0 0 24px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .hint { padding:0 20px 24px; color:var(--mute); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>Film order</h1>
  <span class="meta" id="count"></span>
  <span class="spacer"></span>
  <a class="link" href="/photography.html" target="_blank">Preview site ↗</a>
  <span id="status"></span>
  <button id="revert">Revert</button>
  <button id="save" class="primary" disabled>Save</button>
</header>
<div class="grid" id="grid"></div>
<p class="hint">Drag cards to reorder. Click a caption to edit. × removes the entry from the gallery (the file stays). Save writes content/photos.json.</p>
<script>
  let photos = [], saved = '', newFiles = new Set();
  const grid = document.getElementById('grid');
  const status = document.getElementById('status');
  const saveBtn = document.getElementById('save');

  const base = p => p.src.split('/').pop();

  function setDirty() {
    const d = JSON.stringify(photos) !== saved;
    saveBtn.disabled = !d;
    status.textContent = d ? 'Unsaved' : '';
    status.className = d ? 'dirty' : '';
  }

  function render() {
    grid.innerHTML = '';
    photos.forEach((p, i) => {
      const c = document.createElement('div');
      c.className = 'card'; c.draggable = true; c.dataset.i = i;
      c.innerHTML = `
        <img class="thumb" src="/${p.src}" loading="lazy">
        ${newFiles.has(base(p)) ? '<span class="new">New</span>' : ''}
        <div class="row"><span class="n">${i + 1}</span><input value="${(p.caption || '').replace(/"/g, '&quot;')}" placeholder="Caption"><button class="rm" title="Remove from gallery">×</button></div>
        <div class="file">${base(p)}</div>`;
      c.querySelector('input').addEventListener('input', e => { p.caption = e.target.value; setDirty(); });
      c.querySelector('input').addEventListener('focus', () => { c.draggable = false; });
      c.querySelector('input').addEventListener('blur', () => { c.draggable = true; });
      c.querySelector('.rm').addEventListener('click', () => { photos.splice(i, 1); render(); setDirty(); });
      c.addEventListener('dragstart', e => { drag = i; c.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; });
      c.addEventListener('dragend', () => { drag = null; clearOver(); render(); });
      c.addEventListener('dragover', e => {
        e.preventDefault();
        if (drag === null || drag === i) return;
        const r = c.getBoundingClientRect();
        const before = (e.clientX - r.left) < r.width / 2;
        clearOver();
        c.classList.add(before ? 'over-before' : 'over-after');
        c.dataset.before = before ? '1' : '';
      });
      c.addEventListener('drop', e => {
        e.preventDefault();
        if (drag === null || drag === i) return;
        const item = photos.splice(drag, 1)[0];
        let to = i > drag ? i - 1 : i;
        if (!c.dataset.before) to += 1;
        photos.splice(to, 0, item);
        drag = null; render(); setDirty();
      });
      grid.appendChild(c);
    });
    document.getElementById('count').textContent = photos.length + ' photos' + (newFiles.size ? ' · ' + newFiles.size + ' new' : '');
  }
  let drag = null;
  const clearOver = () => grid.querySelectorAll('.card').forEach(x => x.classList.remove('over-before', 'over-after'));

  async function load() {
    const r = await fetch('/api/photos'); const j = await r.json();
    photos = j.photos; newFiles = new Set(j.new); saved = JSON.stringify(photos);
    render(); setDirty();
  }
  saveBtn.addEventListener('click', async () => {
    status.textContent = 'Saving…';
    const r = await fetch('/api/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(photos) });
    if (r.ok) { saved = JSON.stringify(photos); setDirty(); status.textContent = 'Saved'; setTimeout(setDirty, 1500); }
    else status.textContent = 'Save failed';
  });
  document.getElementById('revert').addEventListener('click', () => { photos = JSON.parse(saved); render(); setDirty(); });
  window.addEventListener('beforeunload', e => { if (!saveBtn.disabled) e.preventDefault(); });
  load();
</script>
</body>
</html>
